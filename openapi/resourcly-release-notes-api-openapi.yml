openapi: 3.2.0
info:
  description: API for document processing, item similarity search, and analytics.
  title: Resourcly Release Notes API
  termsOfService: https://resourcly.com/terms
  contact:
    name: API Support
    email: support@resourcly.com
  license:
    name: Proprietary
  version: 1.0.0
servers:
- url: https://api.resourcly.com/v1
tags:
- name: Release Notes
paths:
  /v1/release-notes:
    get:
      security:
      - BearerAuth: []
      description: Returns sent release notes visible to the caller's business.
      tags:
      - Release Notes
      summary: List release notes (what's new)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.CustomerChangelogResponse'
      operationId: getV1ReleaseNotes
      x-operation-id-source: derived
components:
  schemas:
    models.CustomerChangelogItem:
      type: object
      properties:
        category:
          type: string
        customer_text:
          type: string
        released_at:
          type: string
    models.CustomerChangelogResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/models.CustomerChangelogItem'
  securitySchemes:
    BearerAuth:
      description: 'Firebase JWT token. Format: "Bearer {token}"'
      type: apiKey
      name: Authorization
      in: header
