aid: resourcly
name: Resourcly
description: >-
  Resourcly is an AI-powered platform for deep inventory optimisation across
  manufacturing. It harmonises fragmented PLM and ERP parts data, finds duplicate
  and substitute parts through similarity and visual search, and turns that
  reconciled inventory core into working-capital and part-availability gains.
  The platform ingests documents, BOMs, ERP inventory files and supplier
  catalogs, runs AI-driven similarity clustering, price and should-cost analysis,
  HS-code classification and BOM comparison, and surfaces procurement
  recommendations. A public REST API (Swagger 2.0, Firebase-JWT authenticated)
  exposes documents, items, inventory, BOMs, suppliers, storage, search and
  analytics operations. Resourcly is a Techstars-backed company.
